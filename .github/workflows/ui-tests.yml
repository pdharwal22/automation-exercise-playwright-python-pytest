name: UI Automation Test

on:
  push:
    branches:
      - develop
      - main
  
  pull_request:
    branches:
      - develop
      - main
  
  workflow_dispatch:

jobs:
  ui-tests:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Install Playwright browsers
        run: | 
          playwright install --with-deps chromium

      - name: Install Allure CLI
        run: | 
          curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.44.0/allure-2.44.0.tgz
          sudo tar -xzf allure.tgz -C /opt
          sudo ln -sf /opt/allure-2.44.0/bin/allure /usr/local/bin/allure
          allure --version
      
      - name: Run UI tests
        run: | 
          pytest tests/ui -v -s --alluredir=reports/allure-results

      - name: Generate Allure report
        if: always()
        run: | 
          allure generate reports/allure-results -o reports/allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report

      - name: Upload Allure results
        if : always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/

      - name: Verify Automation Exercise accessibility
        run: | 
          python - <<'PY'
          import requests

          url = "https://automationexercise.com"

          response = requests.get(url, timeout=30)

          print("Status:", response.status_code)
          print("Final URL:", response.url)
          print("Content-Type:", response.headers.get("content-type"))
          print("Content-Length:", len(response.content))
          print("First 500 characters:")
          print(response.text[:500])
          PY

